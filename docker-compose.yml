version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: lms-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/learnstream_lms
      - JWT_SECRET=supersecret_key_change_in_prod
      - VAPID_PUBLIC_KEY=dummy_public_key
      - VAPID_PRIVATE_KEY=dummy_private_key
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: ./frontend
    container_name: lms-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
