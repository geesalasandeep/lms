version: "1"
services:
  # 1. Backend Service (Node.js)
  - type: web
    name: lms-backend-antigravity
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20

  # 2. Frontend (Node.js Web Service to Host Angular)
  # This uses "type: web" to avoid the "unknown type static" error.
  - type: web
    name: lms-frontend-antigravity
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 10000
