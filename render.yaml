version: "1"
services:
  # 1. Backend Service (Node.js)
  - type: web
    name: lms-backend-antigravity
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20

  # 2. Frontend (Angular Static Site)
  # IMPORTANT: Must be "static_site" to support "routingRules"
  - type: web
    name: lms-frontend-antigravity
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/frontend/browser
    routingRules:
      - route: /*
        rewritePath: /index.html
