version: "1"
services:
  # --- 1. Backend Web Service (Node.js) ---
  - type: web
    name: lms-backend-antigravity
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard to your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20

  # --- 2. Frontend Static Site (Angular) ---
  # IMPORTANT: type must be static_site to support routingRules
  - type: static_site
    name: lms-frontend-antigravity
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/frontend/browser
    routingRules:
      - route: /*
        rewritePath: /index.html
