<div class="admin-container p-4">
    <div class="header d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <button class="btn btn-link text-white p-0 me-3 text-decoration-none d-flex align-items-center"
                routerLink="/dashboard">
                <i class="bi bi-arrow-left fs-4 me-2"></i> Back
            </button>
            <h2 class="mb-0">Admin Management Console</h2>
        </div>
        <div class="btn-group">
            <button class="btn" [ngClass]="activeTab === 'course' ? 'btn-primary' : 'btn-outline-primary'"
                (click)="activeTab = 'course'">Courses</button>
            <button class="btn" [ngClass]="activeTab === 'chapter' ? 'btn-primary' : 'btn-outline-primary'"
                (click)="activeTab = 'chapter'">Add Chapter</button>
            <button class="btn" [ngClass]="activeTab === 'assignment' ? 'btn-primary' : 'btn-outline-primary'"
                (click)="activeTab = 'assignment'">Add Assignment</button>
        </div>
    </div>

    <div *ngIf="message" class="alert alert-info">{{ message }}</div>

    <!-- Course List & Create Course -->
    <div *ngIf="activeTab === 'course'">
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <h5>Create New Course</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" class="form-control" placeholder="Course Title"
                            [(ngModel)]="courseData.title"></div>
                    <div class="col-md-6"><input type="text" class="form-control" placeholder="Thumbnail URL"
                            [(ngModel)]="courseData.thumbnailUrl"></div>
                    <div class="col-12"><textarea class="form-control" placeholder="Description"
                            [(ngModel)]="courseData.description"></textarea></div>
                    <div class="col-md-4"><input type="number" class="form-control" placeholder="Price (₹)"
                            [(ngModel)]="courseData.price"></div>
                    <div class="col-md-4"><button class="btn btn-success w-100" (click)="createCourse()">Create
                            Course</button></div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <h4 class="mb-4 d-flex align-items-center">
                <span class="badge bg-primary me-2">{{ courses.length }}</span>
                Existing Courses Catalog
            </h4>
            <div class="row g-4">
                <div class="col-xl-3 col-lg-4 col-md-6" *ngFor="let c of courses">
                    <div class="card h-100 course-item-card">
                        <div class="card-img-container">
                            <img [src]="c.thumbnailUrl || 'https://via.placeholder.com/300x160'" class="card-img-top"
                                alt="...">
                            <div class="price-badge">₹{{ c.price }}</div>
                        </div>
                        <div class="card-body d-flex flex-direction-column">
                            <h5 class="card-title text-truncate">{{ c.title }}</h5>
                            <p class="card-text small text-secondary flex-grow-1 line-clamp-2">
                                {{ c.description || 'No description provided.' }}
                            </p>
                            <div class="mt-3 d-flex gap-2">
                                <button class="btn btn-sm btn-success flex-grow-1" (click)="prepareChapter(c._id)">
                                    + Chapter
                                </button>
                                <button class="btn btn-sm btn-outline-light" (click)="goToCourse(c._id)">
                                    View
                                </button>
                                <button class="btn btn-sm btn-outline-primary" (click)="activeTab = 'course'">
                                    Edit
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Chapter Form -->
    <div *ngIf="activeTab === 'chapter'">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5>Add Chapter to Course</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label>Target Course ID</label>
                        <input type="text" class="form-control" [(ngModel)]="chapterData.courseId"
                            placeholder="Select a course first or paste ID">
                    </div>
                    <div class="col-md-8"><input type="text" class="form-control" placeholder="Chapter Title"
                            [(ngModel)]="chapterData.title"></div>
                    <div class="col-md-2"><input type="number" class="form-control" placeholder="Order"
                            [(ngModel)]="chapterData.order"></div>
                    <div class="col-md-2"><input type="number" class="form-control" placeholder="Duration (min)"
                            [(ngModel)]="chapterData.durationMinutes"></div>
                    <div class="col-12">
                        <label class="form-label">Upload Video Lesson</label>
                        <input type="file" class="form-control" (change)="onFileSelected($event)" accept="video/*">
                    </div>
                    <div class="col-12"><button class="btn btn-primary px-5" (click)="createChapter()">Upload & Save
                            Chapter</button></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Multi-Question Assignment -->
    <div *ngIf="activeTab === 'assignment'">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h5>Create Assessment (Multi-Question)</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label>Chapter ID</label>
                    <input type="text" class="form-control" [(ngModel)]="assignmentData.chapterId">
                </div>
                <div class="mb-4">
                    <label>Passing Score (%)</label>
                    <input type="number" class="form-control" [(ngModel)]="assignmentData.passingScore">
                </div>

                <hr>

                <div *ngFor="let q of assignmentData.questions; let i = index"
                    class="question-block border p-3 mb-3 rounded">
                    <div class="d-flex justify-content-between">
                        <h6>Question {{ i + 1 }}</h6>
                        <button class="btn btn-sm btn-danger" (click)="removeQuestion(i)"
                            *ngIf="assignmentData.questions.length > 1">Remove</button>
                    </div>
                    <input type="text" class="form-control mb-3" placeholder="Question Text"
                        [(ngModel)]="q.questionText">

                    <div class="options-grid ms-3">
                        <div *ngFor="let opt of q.options; let j = index" class="input-group mb-2">
                            <div class="input-group-text">
                                <input type="checkbox" [(ngModel)]="opt.isCorrect">
                            </div>
                            <input type="text" class="form-control" placeholder="Option {{ j + 1 }}"
                                [(ngModel)]="opt.text">
                        </div>
                        <button class="btn btn-sm btn-link" (click)="addOption(i)">+ Add Option</button>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary" (click)="addQuestion()">+ Add Another Question</button>
                    <button class="btn btn-warning px-5" (click)="createAssignment()">Finalize Assignment</button>
                </div>
            </div>
        </div>
    </div>
</div>
