<div class="player-container" *ngIf="!loading && data">

    <div class="header">
        <button class="btn-back" (click)="router.navigate(['/course', courseId])">
            &larr; Back to Course
        </button>
        <h2>{{ data.chapter.title }}</h2>
    </div>

    <div class="video-wrapper" *ngIf="!showAssignment">
        <!-- Assuming the backend serves the multer uploads statically -->
        <video style="height: 500px;" *ngIf="safeVideoUrl" controls autoplay muted controlsList="nodownload"
            (ended)="onVideoEnded()" (error)="onVideoError($event)" [src]="safeVideoUrl">
        </video>
    </div>

    <div class="assignment-overlay" *ngIf="showAssignment">
        <div class="assignment-card card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Knowledge Check: {{ data?.chapter?.title }}</h4>
            </div>
            <div class="card-body overflow-auto" style="max-height: 70vh;">
                <div *ngIf="!assignmentResult">
                    <p class="text-muted mb-4">Please answer all questions below. You need at least 40% to proceed.</p>

                    <div *ngFor="let q of data.assignment.questions; let i = index" class="question-item mb-4">
                        <h5>{{ i + 1 }}. {{ q.questionText }}</h5>
                        <div class="options-list ms-3">
                            <div *ngFor="let opt of q.options; let j = index" class="form-check mb-2">
                                <input class="form-check-input" type="radio" [name]="'question' + i"
                                    [id]="'opt' + i + j" [(ngModel)]="selectedAnswers[i]" [value]="j">
                                <label class="form-check-label" [for]="'opt' + i + j">
                                    {{ opt.text }}
                                </label>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 mt-3" (click)='submitAssignment()'
                        [disabled]="selectedAnswers.length < data.assignment.questions.length">
                        Submit Assessment
                    </button>
                </div>

                <div *ngIf="assignmentResult" class="text-center py-4">
                    <div class="result-icon mb-3">
                        <span class="display-1" *ngIf="assignmentPassed">✅</span>
                        <span class="display-1" *ngIf="!assignmentPassed">❌</span>
                    </div>
                    <h3>{{ assignmentResult }}</h3>
                    <button class="btn btn-outline-secondary mt-3" *ngIf="!assignmentPassed"
                        (click)="assignmentResult = ''; selectedAnswers = []">
                        Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="loader-container" *ngIf="loading">
        <div class="spinner"></div>
    </div>
</div>
